sites:
  default:
    repo: "/home/jovens/developer/repos/loom-test-site"
    branch: "main"

  gotcode.org:
    repo: "git@ssh.gotcode.org:/git/gotcode/gotcode-web.git"
    branch: "main"
    aliases:
      - "www.gotcode.org"
      - "origin.gotcode.org"
    auth:
      type: "ssh"
      path: "/home/jovens/.ssh/id_rsa"
    tls_cert: "/app/data/certs/gotcode-cert.pem"
    tls_key: "/app/data/certs/gotcode-key.pem"

  sourcevault.dev:
    redirect: "https://gotcode.org/projects/sourcevault"
    aliases:
      - "www.sourcevault.dev"
    tls_cert: "/app/data/certs/sourcevault-cert.pem"
    tls_key: "/app/data/certs/sourcevault-key.pem"

  gotunix.net:
    redirect: "https://gotcode.org"
    aliases:
      - "www.gotunix.net"
    tls_cert: "/app/data/certs/gotunix-cert.pem"
    tls_key: "/app/data/certs/gotunix-key.pem"

vanity_imports:
  "/test-module": "git https://github.com/gotcode-org/loom"

git_auth:
  "ssh.gotcode.org": "/home/jovens/.ssh/id_rsa"
